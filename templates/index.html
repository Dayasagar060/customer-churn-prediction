<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Churn Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Customer Churn Prediction</h1>

        <form action="/predict" method="POST">

            <label>Credit Score</label>
            <input type="number" name="credit_score" required>

            <label>Country</label>
            <select name="country" required>
                <option value="France">France</option>
                <option value="Germany">Germany</option>
                <option value="Spain">Spain</option>
            </select>

            <label>Gender</label>
            <select name="gender" required>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
            </select>

            <label>Age</label>
            <input type="number" name="age" required>

            <label>Tenure</label>
            <input type="number" name="tenure" required>

            <label>Balance</label>
            <input type="number" name="balance" step="0.01" required>

            <label>Number of Products</label>
            <input type="number" name="products_number" min="1" required>

            <label>Credit Card</label>
            <select name="credit_card" required>
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <label>Active Member</label>
            <select name="active_member" required>
                <option value="1">Yes</option>
                <option value="0">No</option>
            </select>

            <label>Estimated Salary</label>
            <input type="number" name="estimated_salary" step="0.01" required>

            <button type="submit">
                Predict Churn
            </button>

        </form>

    </div>

</body>

</html>
